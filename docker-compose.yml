version: '3.8'

services:
  backend:
    build: ./backend
    container_name: absensipintar-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:/app/prisma/dev.db
      - JWT_SECRET=${JWT_SECRET}
      # Add other env vars here from .env
    volumes:
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    container_name: absensipintar-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: absensipintar-tunnel
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      - frontend
      - backend
